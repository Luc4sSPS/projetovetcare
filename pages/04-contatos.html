<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VETCARE - CONTATOS</title>
    <link rel="stylesheet" href="../styles/04-contatos.css">
</head>
<body>
    <main class="contatos">

        <section class="chamada">
            <h1>Despertamos seu interesse?</h1>

            <p>
                Entre em contato conosco e dê ao seu pet
                <br class="quebra-desktop">
                o atendimento que ele merece!
            </p>
        </section>

        <section class="opcoes-contato">

            <a class="contato-item"
               href="tel:+5500000000000">
                <span class="icone telefone" aria-hidden="true">
                    <img src="../images/logotelefone.png" alt="">
                </span>
                <span>Telefone</span>
            </a>

            <a class="contato-item"
               href="https://wa.me/5500000000000"
               target="_blank"
               rel="noopener noreferrer">
                <span class="icone whatsapp" aria-hidden="true">
                    <img src="../images/logowhatsapp.png" alt="">
                </span>
                <span>WhatsApp</span>
            </a>

            <a class="contato-item"
               href="mailto:contato@vetcare.com.br">
                <span class="icone email" aria-hidden="true">
                    <img src="../images/logoemail.png" alt="">
                </span>
                <span>Email</span>
            </a>

        </section>

    </main>

</body>
</html>
