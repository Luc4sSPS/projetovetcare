
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços e Ideais - Clínica Veterinária</title>
    <link rel="stylesheet" href="../styles/03-servicos.css">

    <!-- Biblioteca de ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header class="cabecalho">
        <div class="introducao">
            Introdução sobre os serviços<br>
            prestados pela clínica
        </div>

        <div class="titulo">
            Serviços e Ideais
        </div>
    </header>

    <main class="servicos">

        <!-- Atendimento Clínico -->
        <section class="servico atendimento">
            <div class="icone">
                <i class="fa-solid fa-stethoscope"></i>
                <i class="fa-solid fa-paw"></i>
            </div>

            <div class="descricao">
                <h2>Atendimento Clínico</h2>
                <p>
                    Análise para verificar a saúde do seu pet.
                </p>
            </div>
        </section>

        <!-- Vacinação -->
        <section class="servico vacinacao">

            <div class="descricao">
                <h2>Vacinação</h2>
                <p>
                    Ajuda ao seu pet no combate à doenças e vírus.
                </p>
            </div>

            <div class="icone">
                <i class="fa-solid fa-syringe"></i>
                <i class="fa-solid fa-paw"></i>
            </div>

        </section>

    </main>

</body>
</html>
